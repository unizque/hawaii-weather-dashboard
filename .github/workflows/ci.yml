name: Verify application

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Exercise NOAA data sync
        run: npm run sync:data

      - name: Verify NOAA imagery services
        id: imagery
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run verify:imagery 2>&1 | tee imagery-check.log
          imagery_status=${PIPESTATUS[0]}
          {
            echo '### NOAA imagery service check'
            echo '```text'
            sed -n '1,120p' imagery-check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$imagery_status"

      - name: Type-check
        id: typecheck
        if: always()
        shell: bash
        run: |
          set +e
          npm run check 2>&1 | tee typecheck.log
          typecheck_status=${PIPESTATUS[0]}
          if [ "$typecheck_status" -ne 0 ]; then
            {
              echo '### Type-check output'
              echo '```text'
              sed -n '1,120p' typecheck.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$typecheck_status"

      - name: Unit tests
        if: always()
        run: npm run test

      - name: Production build
        if: always()
        run: npm run build

      - name: Confirm external services
        if: always()
        run: test "${{ steps.imagery.outcome }}" = "success"

      - name: Report diagnostic output
        if: always() && github.event_name == 'pull_request' && (steps.imagery.outcome != 'success' || steps.typecheck.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '<!-- pacific-signal-ci-diagnostics -->'
            echo '### Validation diagnostics'
            echo
            echo '#### NOAA imagery check'
            echo '```text'
            sed -n '1,160p' imagery-check.log 2>/dev/null || true
            echo '```'
            echo
            echo '#### Type-check'
            echo '```text'
            sed -n '1,200p' typecheck.log 2>/dev/null || true
            echo '```'
          } > diagnostics.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file diagnostics.md
