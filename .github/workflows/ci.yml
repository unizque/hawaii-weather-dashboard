name: Verify application

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Exercise NOAA data sync
        run: npm run sync:data

      - name: Verify NOAA radar history
        shell: bash
        run: |
          set +e
          npm run verify:radar 2>&1 | tee radar-check.log
          radar_status=${PIPESTATUS[0]}
          {
            echo '### NOAA radar service check'
            echo '```text'
            sed -n '1,120p' radar-check.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$radar_status"

      - name: Type-check
        shell: bash
        run: |
          set +e
          npm run check 2>&1 | tee typecheck.log
          typecheck_status=${PIPESTATUS[0]}
          if [ "$typecheck_status" -ne 0 ]; then
            {
              echo '### Type-check output'
              echo '```text'
              sed -n '1,120p' typecheck.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$typecheck_status"

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
